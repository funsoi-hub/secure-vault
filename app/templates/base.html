<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Vault{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">&#128274; Secure Vault</a>
    {% if user %}
    <nav>
      <a href="/notes">Notes</a>
      <a href="/files">Files</a>
      <a href="/account">Account</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% if errors %}<div class="alert error"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Encrypted with AES-256-GCM &middot; <a href="https://github.com/funsoi-hub/secure-vault">Source</a></footer>
</body>
</html>
