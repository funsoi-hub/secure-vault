{% extends "base.html" %}
{% block title %}Two-factor check · Secure Vault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter your 6-digit code</h1>
  <p class="muted">Open your authenticator app and enter the current code for Secure Vault.</p>
  <form method="post" action="/login/mfa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required maxlength="7"></label>
    <button type="submit">Verify</button>
  </form>
</section>
{% endblock %}
