{% extends "base.html" %}
{% block title %}Sign in · Secure Vault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if registered %}<div class="alert ok">Account created. Sign in to continue.</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required maxlength="254"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="128"></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
