[project]
name = "secure-vault"
version = "1.0.0"
description = "Encrypted notes and file vault built with security across the SDLC"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework's intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake passwords are fine in tests

[tool.bandit]
exclude_dirs = ["tests"]
